services:
  - type: web
    name: snojrc-event-media
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT main:app
    healthCheckPath: /health
    envVars:
      - key: PRODUCTION
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: CACHE_ROOT
        value: /var/data/cache
      - key: MAX_UPLOAD_MB
        value: "500"
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: event-media
      mountPath: /var/data
      sizeGB: 10
