{% extends "base.html" %}
{% block title %}{{ code }} · {{ site_name }}{% endblock %}
{% block content %}
<section class="error-page page-shell">
  <span>{{ code }}</span>
  <p class="eyebrow">Nothing to see here</p>
  <h1>{{ heading }}</h1>
  <p>{{ message }}</p>
  <a class="button button-primary" href="{{ url_for('browse') }}">Return to galleries</a>
</section>
{% endblock %}
